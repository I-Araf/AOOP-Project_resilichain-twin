services:
  postgres:
    image: postgres:16-alpine
    container_name: resilichain-postgres
    environment:
      POSTGRES_DB: resilichain
      POSTGRES_USER: resilichain
      POSTGRES_PASSWORD: resilichain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilichain"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka-API-compatible broker for shipment-events/disruption-events (blueprint Stage 5).
  # Redpanda over real Kafka per the blueprint's own free-tools note: same wire protocol,
  # much faster to stand up locally, no code changes needed against the Kafka client API.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: resilichain-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
