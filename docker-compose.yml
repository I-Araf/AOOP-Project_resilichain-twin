services:
  postgres:
    image: postgres:16-alpine
    container_name: resilichain-postgres
    environment:
      POSTGRES_DB: resilichain
      POSTGRES_USER: resilichain
      POSTGRES_PASSWORD: resilichain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilichain"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
